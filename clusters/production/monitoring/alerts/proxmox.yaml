apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alert-manager-proxmox
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: proxmox.rules
      rules:
        # Notifies if a Proxmox LXC/VM is down for >5 minutes and
        # was running for the majority of the previous 24 hours.
        - alert: ProxmoxGuestDown
          expr: |
            (
              (
                pve_up{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"} == 0
              )
              and on (id, instance)
              (
                avg_over_time(
                  pve_up{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}[24h]
                ) > 0.5
              )
              and on (id, instance)
              (
                pve_up{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"} offset 23h
              )
            )
            * on (id, instance) group_left(name, type)
            pve_guest_info{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter", template!="1"}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Proxmox guest {{ $labels.name }} is down"
            description: "The Proxmox {{ $labels.type }} '{{ $labels.name }}' (ID: {{ $labels.id }}) is not running and was running for the majority of the previous 24 hours."

        # Notifies if Host CPU usage is >75% for 10mins
        - alert: ProxmoxHostCpuHigh
          expr: |
            (
              pve_cpu_usage_ratio{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
              * on (id, instance) group_left(name)
              pve_node_info{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
            ) > 0.75
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox host {{ $labels.name }} CPU usage high"
            description: "Host '{{ $labels.name }}' (ID: {{ $labels.id }}) has a CPU usage of {{ $value | humanizePercentage }}."

        # Notifies if Host disk usage is >75% for 5mins
        - alert: ProxmoxHostStorageHigh
          expr: |
            (
              (
                pve_disk_usage_bytes{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", id=~"storage/.+", job="proxmox-ve-exporter"}
                /
                pve_disk_size_bytes{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", id=~"storage/.+", job="proxmox-ve-exporter"}
              )
              * on (id, instance) group_left(storage)
              pve_storage_info{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", storage!="local", job="proxmox-ve-exporter"}
            ) > 0.75
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox storage {{ $labels.storage }} usage high"
            description: "The Proxmox storage pool '{{ $labels.storage }}' (ID: {{ $labels.id }}) has disk usage of {{ $value | humanizePercentage }} (Threshold: 80%)."

        # Notifies if Host RAM usage is >75% for 10mins
        - alert: ProxmoxHostMemoryHigh
          expr: |
            (
              (
                pve_memory_usage_bytes{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
                /
                pve_memory_size_bytes{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
              )
              * on (id, instance) group_left(name)
              pve_node_info{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
            ) > 0.75
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox host {{ $labels.name }} memory usage high"
            description: "Host '{{ $labels.name }}' (ID: {{ $labels.id }}) has a memory usage of {{ $value | humanizePercentage }}."

        # Notifies if Guest CPU usage is >75% for 10mins
        - alert: ProxmoxGuestCpuHigh
          expr: |
            (
              (
                (
                  pve_cpu_usage_ratio{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
                  /
                  pve_cpu_usage_limit{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
                )
                * on (id, instance) group_left(name, type)
                pve_guest_info{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter", template!="1"}
              )
              and on (id, instance)
              (pve_up{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"} == 1)
            ) > 0.75
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox guest {{ $labels.name }} CPU usage high"
            description: "The Proxmox {{ $labels.type }} '{{ $labels.name }}' (ID: {{ $labels.id }}) has a CPU usage of {{ $value | humanizePercentage }}."

        # Notifies if LXC RAM usage is >75% for 10mins
        - alert: ProxmoxLxcGuestMemoryHigh
          expr: |
            (
              (
                (
                  pve_memory_usage_bytes{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
                  /
                  pve_memory_size_bytes{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
                )
                * on (id, instance) group_left(name, type)
                pve_guest_info{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter", template!="1", type="lxc", id!="lxc/103"}
              )
              and on (id, instance)
              (pve_up{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"} == 1)
            ) > 0.75
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox LXC {{ $labels.name }} memory usage high"
            description: "The Proxmox LXC '{{ $labels.name }}' (ID: {{ $labels.id }}) has memory usage of {{ $value | humanizePercentage }} (Threshold: 75%)."

        # Notifies if VM RAM usage is >95% for 10mins
        - alert: ProxmoxVmGuestMemoryHigh
          expr: |
            (
              (
                (
                  pve_memory_usage_bytes{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
                  /
                  pve_memory_size_bytes{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
                )
                * on (id, instance) group_left(name, type)
                pve_guest_info{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter", template!="1", type="qemu"}
              )
              and on (id, instance)
              (pve_up{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"} == 1)
            ) > 0.95
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox VM {{ $labels.name }} memory usage high"
            description: "The Proxmox VM (QEMU) '{{ $labels.name }}' (ID: {{ $labels.id }}) has memory usage of {{ $value | humanizePercentage }} (Threshold: 90%)."

        # Notifies if LXC disk usage is >80% for 5mins
        - alert: ProxmoxLxcGuestDiskHigh
          expr: |
            (
              (
                (
                  pve_disk_usage_bytes{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
                  /
                  pve_disk_size_bytes{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"}
                )
                * on (id, instance) group_left(name, type)
                pve_guest_info{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter", template!="1", type="lxc"}
              )
              and on (id, instance)
              (pve_up{instance="exporter-proxmox.monitoring.svc.cluster.local:9221", job="proxmox-ve-exporter"} == 1)
            ) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox LXC {{ $labels.name }} disk usage high"
            description: "The Proxmox LXC '{{ $labels.name }}' (ID: {{ $labels.id }}) has disk usage of {{ $value | humanizePercentage }} (Threshold: 80%)."

        # Notifies if CPU is >80C for 5mins
        - alert: ProxmoxCPUTempHigh
          expr: node_hwmon_temp_celsius{job="proxmox-exporter", chip=~"pci.*", sensor="temp1"} > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU Temperature on {{ $labels.instance }}"
            description: 'The CPU Die temperature is {{ $value | printf "%.1f" }}°C (Threshold: 80°C).'

        # Triggers if MB Temp >60C for 5mins
        - alert: ProxmoxMotherboardTempHigh
          expr: node_hwmon_temp_celsius{job="proxmox-exporter", chip=~"platform.*", sensor="temp1"} > 60
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High Motherboard Temperature on {{ $labels.instance }}"
            description: 'The System/Motherboard temperature is {{ $value | printf "%.1f" }}°C. Check case fans.'

        # Triggers if NVMe >75C for 5mins
        - alert: ProxmoxNVMeTempHigh
          expr: node_hwmon_temp_celsius{job="proxmox-exporter", chip=~"nvme.*", sensor="temp1"} > 75
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High NVMe Temperature on {{ $labels.instance }}"
            description: 'The NVMe drive temperature is {{ $value | printf "%.1f" }}°C (Threshold: 75°C).'

        # Triggers if GPU >75C for 5mins
        - alert: ProxmoxGPUTempHigh
          expr: max by (instance) (node_hwmon_temp_celsius{job="proxmox-exporter", chip="0000:08:01_0_0000:09:00_0", sensor="temp2"}) > 75
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High GPU Temperature on {{ $labels.instance }}"
            description: 'The GPU temperature is {{ $value | printf "%.1f" }}°C (Threshold: 75°C).'

        - alert: ProxmoxDiskSmartHealthFailed
          expr: |
            smartmon_device_smart_healthy{job="proxmox-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SMART health check failed for {{ $labels.disk }}"
            description: "Disk {{ $labels.disk }} on {{ $labels.instance }} has failed its SMART health assessment."

        - alert: ProxmoxDiskMissing
          expr: |
            (count(smartmon_device_info{job="proxmox-exporter"}) < 4)
            and on ()
            (max(up{job="proxmox-exporter"}) == 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "A monitored Proxmox disk is missing"
            description: "Only {{ $value | humanize }} of the four expected Proxmox disks have SMART metrics."

        - alert: ProxmoxDiskPendingSectors
          expr: |
            smartmon_current_pending_sector_raw_value{job="proxmox-exporter"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pending sectors detected on {{ $labels.disk }}"
            description: "Disk {{ $labels.disk }} has {{ $value | humanize }} sectors waiting to be remapped."

        - alert: ProxmoxDiskUncorrectableSectors
          expr: |
            sum by (instance, disk, type) (
              smartmon_offline_uncorrectable_raw_value{job="proxmox-exporter"}
              or
              smartmon_reported_uncorrect_raw_value{job="proxmox-exporter"}
            ) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Uncorrectable sectors detected on {{ $labels.disk }}"
            description: "Disk {{ $labels.disk }} has {{ $value | humanize }} uncorrectable sector errors."

        - alert: ProxmoxDiskTemperatureCritical
          expr: |
            smartmon_temperature_celsius_raw_value{job="proxmox-exporter", type="sat"} > 55
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Critical disk temperature on {{ $labels.disk }}"
            description: 'Disk {{ $labels.disk }} has been at {{ $value | printf "%.1f" }}°C for over 5 minutes.'

        - alert: ProxmoxSmartCollectorStale
          expr: |
            time() - smartmon_smartctl_run{job="proxmox-exporter"} > 15 * 60
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "SMART metrics are stale for {{ $labels.disk }}"
            description: "SMART collection for {{ $labels.disk }} has not completed in {{ $value | humanizeDuration }}."

        - alert: ProxmoxDiskSmartUnavailable
          expr: |
            (smartmon_device_smart_available{job="proxmox-exporter", type="sat"} == 0)
            or
            (smartmon_device_smart_enabled{job="proxmox-exporter", type="sat"} == 0)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SMART is unavailable for {{ $labels.disk }}"
            description: "SMART monitoring is unavailable or disabled for SATA disk {{ $labels.disk }}."

        - alert: ProxmoxDiskReallocatedSectors
          expr: |
            smartmon_reallocated_sector_ct_raw_value{job="proxmox-exporter"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Reallocated sectors detected on {{ $labels.disk }}"
            description: "Disk {{ $labels.disk }} has {{ $value | humanize }} reallocated sectors."

        - alert: ProxmoxDiskCrcErrorsIncreasing
          expr: |
            increase(smartmon_udma_crc_error_count_raw_value{job="proxmox-exporter"}[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CRC errors are increasing on {{ $labels.disk }}"
            description: "Disk {{ $labels.disk }} recorded {{ $value | humanize }} additional UDMA CRC errors in the last hour. Check its data and power connections."

        - alert: ProxmoxDiskTemperatureHigh
          expr: |
            (
              smartmon_temperature_celsius_raw_value{job="proxmox-exporter", type="sat"} > 45
            )
            and on (instance, disk, type)
            (
              smartmon_temperature_celsius_raw_value{job="proxmox-exporter", type="sat"} <= 55
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "High disk temperature on {{ $labels.disk }}"
            description: 'Disk {{ $labels.disk }} has been at {{ $value | printf "%.1f" }}°C for over 15 minutes.'
