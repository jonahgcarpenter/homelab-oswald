apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alert-manager-hubble
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: hubble.rules
      rules:
        # Lateral Movement / Policy Denials
        - alert: HubblePolicyDenied
          expr: sum(rate(hubble_drop_total{reason="POLICY_DENIED"}[5m])) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High rate of policy drops detected in the cluster"
            description: 'The cluster is experiencing a surge in Policy Denied dropped packets ({{ $value | printf "%.1f" }} per second).'

        # Unexpected VLAN Traffic
        - alert: HubbleVlanIngressDropsHigh
          expr: |
            sum by (node, source_ip, destination_ip, protocol, reason, traffic_direction) (
              rate(hubble_drop_total{reason="VLAN_FILTERED", traffic_direction="INGRESS"}[5m])
            ) > 20
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'High ingress VLAN drop rate from {{ if $labels.source_ip }}{{ $labels.source_ip }}{{ else }}a non-IP source{{ end }} on {{ $labels.node }}'
            description: 'Cilium is dropping {{ $value | printf "%.1f" }} VLAN packets per second on {{ $labels.node }} from {{ if $labels.source_ip }}{{ $labels.source_ip }}{{ else }}an ARP or non-IP source{{ end }} to {{ if $labels.destination_ip }}{{ $labels.destination_ip }}{{ else }}an unknown or broadcast destination{{ end }} (protocol={{ $labels.protocol }}, direction={{ $labels.traffic_direction }}, reason={{ $labels.reason }}).'

        # Command & Control / Exfiltration (DNS)
        - alert: HubbleHighNXDomainRate
          expr: sum(rate(hubble_dns_responses_total{rcode="Non-Existent Domain"}[5m])) > 10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High Non-Existent Domain rate for {{ $labels.source_workload }}"
            description: "Workload {{ $labels.source_workload }} is aggressively querying a non-existent domain ({{ $labels.query }}). This is highly indicative of malware C2 beaconing or a misconfigured app."
