            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "min(truenas_pool_health{job=\"truenas-exporter\", instance=~\"$instance\", pool=~\"$pool\"})",
              "legendFormat": "Pools",
              "refId": "A"
            }
