            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "max(truenas_system_uptime_seconds{job=\"truenas-exporter\", instance=~\"$instance\"})",
              "legendFormat": "Uptime",
              "refId": "A"
            }
          ],
          "title": "System Uptime",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
