          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "100 * max(truenas_system_memory_used_bytes{job=\"truenas-exporter\", instance=~\"$instance\"}) / max(truenas_system_memory_total_bytes{job=\"truenas-exporter\", instance=~\"$instance\"})",
              "legendFormat": "Memory used",
              "refId": "A"
            }
          ],
          "title": "Memory Usage",
          "type": "stat"
