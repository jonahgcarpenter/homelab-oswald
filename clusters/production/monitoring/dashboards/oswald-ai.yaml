apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-oswald-ai
  labels:
    grafana_dashboard: "1"
data:
  oswald-ai-dashboard.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "Total Prompts Per Gateway",
          "description": "Prompts admitted by the gateway runtime during the selected range. Excludes commands and ignored messages; includes prompts that subsequently fail or are canceled.",
          "type": "barchart",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short",
              "custom": {
                "axisPlacement": "auto",
                "fillOpacity": 100,
                "gradientMode": "none",
                "lineWidth": 1,
                "scaleDistribution": {
                  "type": "linear"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              }
            },
            "overrides": []
          },
          "options": {
            "barRadius": 0,
            "barWidth": 0.85,
            "groupWidth": 0.7,
            "orientation": "vertical",
            "showValue": "always",
            "stacking": "none",
            "xField": "gateway",
            "xTickLabelRotation": 0,
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (gateway) (count_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{gateway}}"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            }
          ]
        },
        {
          "id": 6,
          "title": "Tool Executions By Tool",
          "description": "Actual handler executions during the selected range, including failed and canceled executions. Blocked calls are excluded. Uses agent.tool.complete, not diagnostic or tool-specific events.",
          "type": "barchart",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 8,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short",
              "custom": {
                "axisPlacement": "auto",
                "fillOpacity": 100,
                "gradientMode": "none",
                "lineWidth": 1,
                "scaleDistribution": {
                  "type": "linear"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              }
            },
            "overrides": []
          },
          "options": {
            "barRadius": 0,
            "barWidth": 0.85,
            "groupWidth": 0.7,
            "orientation": "horizontal",
            "showValue": "always",
            "stacking": "none",
            "xField": "tool_name",
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (tool_name) (count_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"agent.tool.complete\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{tool_name}}"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            }
          ]
        },
        {
          "id": 4,
          "title": "Prompt Type Distribution",
          "description": "Inbound prompt classification before runtime reply/context enrichment. Excludes commands and ignored messages.",
          "type": "piechart",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "text"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Text Only"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "image"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Image Only"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "text_image"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Text + Image"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "unsupported"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Unsupported"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "empty"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Empty Input"
                  }
                ]
              }
            ]
          },
          "options": {
            "displayLabels": [
              "percent"
            ],
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "values": [
                "value",
                "percent"
              ]
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "sort": "desc",
            "tooltip": {
              "mode": "single",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (prompt_type) (count_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{prompt_type}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Prompts By User",
          "description": "Admitted prompts grouped by canonical user. Linked gateway accounts share a user ID. Counts exclude commands.",
          "type": "table",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "User"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "string"
                  }
                ]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Total"
              }
            ],
            "footer": {
              "show": false,
              "enablePagination": true
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (user_id, gateway) (count_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{gateway}}"
            },
            {
              "refId": "B",
              "editorMode": "code",
              "expr": "sum by (user_id, gateway) (count_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" | label_format gateway=\"Total\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{gateway}}"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns",
                "valueLabel": "gateway"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "user_id": 0,
                  "imessage": 1,
                  "discord": 2,
                  "homeassistant": 3,
                  "Total": 4
                },
                "renameByName": {
                  "user_id": "User",
                  "imessage": "iMessage",
                  "discord": "Discord",
                  "homeassistant": "Home Assistant"
                }
              }
            }
          ]
        },
        {
          "id": 3,
          "title": "End-to-End Prompt Latency",
          "description": "Five-minute rolling latency from gateway receipt through runtime completion, including queueing and delivery. Includes failed and canceled admitted prompts. P95 measures tail latency. Sparse traffic can produce gaps.",
          "type": "timeseries",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "ms",
              "min": 0,
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 5,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 4,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "scaleDistribution": {
                  "type": "linear"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "avg_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"gateway.request.complete\" | request_kind=\"prompt\" | is_admitted=\"true\" | unwrap duration_ms | __error__=\"\" [5m]) by (gateway)",
              "queryType": "range",
              "legendFormat": "{{gateway}} average"
            },
            {
              "refId": "B",
              "editorMode": "code",
              "expr": "quantile_over_time(0.95, {service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"gateway.request.complete\" | request_kind=\"prompt\" | is_admitted=\"true\" | unwrap duration_ms | __error__=\"\" [5m]) by (gateway)",
              "queryType": "range",
              "legendFormat": "{{gateway}} p95"
            }
          ]
        },
        {
          "id": 8,
          "title": "Prompt Outcomes",
          "description": "Terminal status of admitted prompts during the selected range. Counts gateway.request.complete once per addressed runtime operation, not diagnostic error lines. Intentional cancellation normally has status=ok; inspect execution_status to distinguish it.",
          "type": "piechart",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 0,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "ok"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "green",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "error"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "rejected"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "orange",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "degraded"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "yellow",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "displayLabels": [
              "percent"
            ],
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "values": [
                "value",
                "percent"
              ]
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "sort": "desc",
            "tooltip": {
              "mode": "single",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (status) (count_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"gateway.request.complete\" | request_kind=\"prompt\" | is_admitted=\"true\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 9,
          "title": "Observed Chat Tokens",
          "description": "Provider-reported total chat tokens by model and workload during the selected range. Includes reported usage from failed or canceled calls. Missing totals are omitted, not inferred. Do not add these counts to gateway or broker token aggregates: they describe overlapping work.",
          "type": "table",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 8,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              }
            },
            "overrides": []
          },
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Observed Tokens"
              }
            ],
            "footer": {
              "show": false,
              "enablePagination": true
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (model, workload) (sum_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"provider.gateway.chat.complete\" | is_usage_reported=\"true\" | total_tokens!=\"\" | unwrap total_tokens | __error__=\"\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{model}} / {{workload}}"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "model": 0,
                  "workload": 1,
                  "Value": 2
                },
                "renameByName": {
                  "model": "Model",
                  "workload": "Workload",
                  "Value": "Observed Tokens"
                }
              }
            }
          ]
        },
        {
          "id": 10,
          "title": "Chat Usage Reporting",
          "description": "Usage completeness for submitted chat calls during the selected range. Incomplete includes missing, partial, invalid, and unsuccessful-call usage. Complete reporting is not proof of complete billing or lossless log ingestion.",
          "type": "piechart",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 16,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "true"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Complete"
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "green",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "false"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Incomplete / Unknown"
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "orange",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "displayLabels": [
              "percent"
            ],
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "values": [
                "value",
                "percent"
              ]
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "sort": "desc",
            "tooltip": {
              "mode": "single",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (is_usage_complete) (count_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"provider.gateway.chat.complete\" | is_submitted=\"true\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{is_usage_complete}}"
            }
          ]
        },
        {
          "id": 11,
          "title": "Broker Queue and Active Work",
          "description": "Latest broker snapshots within a five-minute lookback, separated by process instance. Snapshots normally occur every 30 seconds. Values can remain stale until the lookback expires; absence is not zero. Outstanding includes active and queued work.",
          "type": "timeseries",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 29
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short",
              "min": 0,
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 5,
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "pointSize": 4,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "scaleDistribution": {
                  "type": "linear"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "last_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"broker.health\" | unwrap queued_count | __error__=\"\" [5m]) by (instance_id)",
              "queryType": "range",
              "legendFormat": "{{instance_id}} queued"
            },
            {
              "refId": "B",
              "editorMode": "code",
              "expr": "last_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"broker.health\" | unwrap active_count | __error__=\"\" [5m]) by (instance_id)",
              "queryType": "range",
              "legendFormat": "{{instance_id}} active"
            },
            {
              "refId": "C",
              "editorMode": "code",
              "expr": "last_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"broker.health\" | unwrap outstanding_count | __error__=\"\" [5m]) by (instance_id)",
              "queryType": "range",
              "legendFormat": "{{instance_id}} outstanding"
            },
            {
              "refId": "D",
              "editorMode": "code",
              "expr": "last_over_time({service_name=\"oswald-ai\"} | json | __error__=\"\" | event=\"broker.health\" | unwrap capacity | __error__=\"\" [5m]) by (instance_id)",
              "queryType": "range",
              "legendFormat": "{{instance_id}} capacity"
            }
          ]
        },
        {
          "id": 12,
          "title": "Background Job Health",
          "description": "Latest database-wide job gauges within a five-minute lookback. Do not sum these across instances sharing one database. Active includes running jobs with expired leases; expired leases are a subset, not additional jobs. Snapshot reads can be delayed or fail, so missing data is not zero.",
          "type": "timeseries",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 29
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short",
              "min": 0,
              "custom": {
                "axisPlacement": "auto",
