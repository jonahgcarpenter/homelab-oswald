        {
          "id": 13,
          "title": "Average Latency Breakdown",
          "description": "Selected-range average phase durations for fully completed, successfully executed and delivered prompts. Agent execution includes model calls, tools, and retries. Phases do not include all gateway overhead. These are averages, not stacked percentiles.",
          "type": "barchart",
          "pluginVersion": "13.0.1",
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 39},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "decimals": 1,
              "unit": "s",
              "min": 0,
              "noValue": "No completed prompts",
              "custom": {
                "axisPlacement": "auto",
                "fillOpacity": 100,
                "lineWidth": 1,
                "scaleDistribution": {"type": "linear"}
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "vertical",
            "barWidth": 0.85,
            "groupWidth": 0.7,
            "showValue": "always",
            "stacking": "none",
            "xField": "gateway",
            "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "avg_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.complete\" | request_kind=\"prompt\" | is_admitted=\"true\" | is_execution_complete=\"true\" | execution_status=\"ok\" | delivery_status=\"ok\" | unwrap queue_wait_ms | __error__=\"\" [$__range]) by (gateway) / 1000",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "Queue wait"
            },
            {
              "refId": "B",
              "editorMode": "code",
              "expr": "avg_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.complete\" | request_kind=\"prompt\" | is_admitted=\"true\" | is_execution_complete=\"true\" | execution_status=\"ok\" | delivery_status=\"ok\" | unwrap agent_duration_ms | __error__=\"\" [$__range]) by (gateway) / 1000",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "Agent execution"
            },
            {
              "refId": "C",
              "editorMode": "code",
              "expr": "avg_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.complete\" | request_kind=\"prompt\" | is_admitted=\"true\" | is_execution_complete=\"true\" | execution_status=\"ok\" | delivery_status=\"ok\" | unwrap delivery_duration_ms | __error__=\"\" [$__range]) by (gateway) / 1000",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "Delivery"
            }
          ],
          "transformations": [
            {"id": "joinByField", "options": {"mode": "outerTabular", "byField": "gateway"}},
            {"id": "filterFieldsByName", "options": {"include": {"names": ["gateway", "Value #A", "Value #B", "Value #C"]}}},
            {
              "id": "organize",
              "options": {
                "indexByName": {"gateway": 0, "Value #A": 1, "Value #B": 2, "Value #C": 3},
                "renameByName": {"Value #A": "Queue wait", "Value #B": "Agent execution", "Value #C": "Delivery"}
              }
            }
          ]
        },
        {
          "id": 14,
          "title": "Foreground Streaming First Output",
          "description": "Fifteen-minute rolling provider time to first thinking/content, per foreground streaming model call. Includes subsequent tool rounds, not just the first call of each prompt. This is not Discord delivery latency. Async calls have no measurement and are excluded, not treated as zero.",
          "type": "timeseries",
          "pluginVersion": "13.0.1",
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 39},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "decimals": 1,
              "unit": "s",
              "min": 0,
              "noValue": "No streaming observations",
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 5,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "none"},
                "scaleDistribution": {"type": "linear"}
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "showLegend": true, "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "avg_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"provider.gateway.chat.complete\" | workload=\"foreground\" | transport=\"streaming\" | time_to_first_output_ms!=\"\" | unwrap time_to_first_output_ms | __error__=\"\" [15m]) by (gateway, model) / 1000",
              "queryType": "range",
              "legendFormat": "{{gateway}} / {{model}} average"
            },
            {
              "refId": "B",
              "editorMode": "code",
              "expr": "quantile_over_time(0.95, {namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"provider.gateway.chat.complete\" | workload=\"foreground\" | transport=\"streaming\" | time_to_first_output_ms!=\"\" | unwrap time_to_first_output_ms | __error__=\"\" [15m]) by (gateway, model) / 1000",
              "queryType": "range",
              "legendFormat": "{{gateway}} / {{model}} p95"
