        {
          "id": 15,
          "title": "Tool Performance",
          "description": "Selected-range actual tool executions, errors, unproductive results, and handler durations. Blocked calls never execute and are excluded. Unproductive results are not failures. Duration includes failed/canceled executions. Error and unproductive counts are zero-filled only for tools with recorded executions.",
          "type": "table",
          "pluginVersion": "13.0.1",
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 48},
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "noValue": "Unknown",
              "custom": {"align": "auto", "cellOptions": {"type": "auto"}, "inspect": false}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Average Duration"},
                "properties": [{"id": "unit", "value": "s"}, {"id": "decimals", "value": 3}]
              },
              {
                "matcher": {"id": "byName", "options": "P95 Duration"},
                "properties": [{"id": "unit", "value": "s"}, {"id": "decimals", "value": 3}]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [{"desc": true, "displayName": "Executions"}],
            "footer": {"show": false, "enablePagination": true}
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (tool_name) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"agent.tool.complete\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "Executions"
            },
            {
              "refId": "B",
              "editorMode": "code",
              "expr": "sum by (tool_name) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"agent.tool.complete\" | status=\"error\" [$__range])) or (0 * sum by (tool_name) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"agent.tool.complete\" [$__range])))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "Errors"
            },
            {
              "refId": "C",
              "editorMode": "code",
              "expr": "sum by (tool_name) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"agent.tool.complete\" | outcome=\"unproductive\" [$__range])) or (0 * sum by (tool_name) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"agent.tool.complete\" [$__range])))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "Unproductive"
            },
            {
              "refId": "D",
              "editorMode": "code",
              "expr": "avg_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"agent.tool.complete\" | unwrap duration_ms | __error__=\"\" [$__range]) by (tool_name) / 1000",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "Average Duration"
            },
            {
              "refId": "E",
              "editorMode": "code",
              "expr": "quantile_over_time(0.95, {namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"agent.tool.complete\" | unwrap duration_ms | __error__=\"\" [$__range]) by (tool_name) / 1000",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "P95 Duration"
            }
          ],
          "transformations": [
            {"id": "joinByField", "options": {"mode": "outerTabular", "byField": "tool_name"}},
            {"id": "filterFieldsByName", "options": {"include": {"names": ["tool_name", "Value #A", "Value #B", "Value #C", "Value #D", "Value #E"]}}},
            {
              "id": "organize",
              "options": {
                "indexByName": {"tool_name": 0, "Value #A": 1, "Value #B": 2, "Value #C": 3, "Value #D": 4, "Value #E": 5},
                "renameByName": {"tool_name": "Tool", "Value #A": "Executions", "Value #B": "Errors", "Value #C": "Unproductive", "Value #D": "Average Duration", "Value #E": "P95 Duration"}
              }
            }
          ]
        },
        {
          "id": 16,
          "title": "Search Index Availability",
          "description": "Latest per-instance availability snapshot within five minutes of the selected range end. Unknown is not healthy. Vector indexes are omitted when embeddings are disabled. A snapshot can remain stale within the lookback; degraded means missing or requiring rebuild, not necessarily total loss of fallback retrieval.",
