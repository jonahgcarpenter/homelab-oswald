apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-oswald-ai
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  oswald-ai-dashboard.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "description": "Current logging schema only (version 1). Legacy records are excluded rather than assigned invented dimensions. Counts cover the selected range; absent usage remains unknown, and missing health telemetry is not zero.",
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "Total Prompts Per Gateway",
          "description": "Prompts admitted by the gateway runtime during the selected range. Excludes commands and ignored messages; includes prompts that subsequently fail or are canceled.",
          "type": "barchart",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short",
              "custom": {
                "axisPlacement": "auto",
                "fillOpacity": 100,
                "gradientMode": "none",
                "lineWidth": 1,
                "scaleDistribution": {
                  "type": "linear"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              }
            },
            "overrides": []
          },
          "options": {
            "barRadius": 0,
            "barWidth": 0.85,
            "groupWidth": 0.7,
            "orientation": "vertical",
            "showValue": "always",
            "stacking": "none",
            "xField": "gateway",
            "xTickLabelRotation": 0,
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (gateway) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{gateway}}"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true},
                "indexByName": {"gateway": 0, "Value #A": 1},
                "renameByName": {"Value #A": "Prompts"}
              }
            }
          ]
        },
        {
          "id": 6,
          "title": "Tool Executions By Tool",
          "description": "Actual handler executions during the selected range, including failed and canceled executions. Blocked calls are excluded. Uses agent.tool.complete, not diagnostic or tool-specific events.",
          "type": "barchart",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 8,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short",
              "custom": {
                "axisPlacement": "auto",
                "fillOpacity": 100,
                "gradientMode": "none",
                "lineWidth": 1,
                "scaleDistribution": {
                  "type": "linear"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              }
            },
            "overrides": []
          },
          "options": {
            "barRadius": 0,
            "barWidth": 0.85,
            "groupWidth": 0.7,
            "orientation": "horizontal",
            "showValue": "always",
            "stacking": "none",
            "xField": "tool_name",
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (tool_name) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"agent.tool.complete\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{tool_name}}"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true},
                "indexByName": {"tool_name": 0, "Value #A": 1},
                "renameByName": {"Value #A": "Executions"}
              }
            }
          ]
        },
        {
          "id": 4,
          "title": "Prompt Type Distribution",
          "description": "Inbound prompt classification before runtime reply/context enrichment. Excludes commands and ignored messages.",
          "type": "piechart",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "text"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Text Only"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "image"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Image Only"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "text_image"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Text + Image"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "unsupported"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Unsupported"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "empty"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Empty Input"
                  }
                ]
              }
            ]
          },
          "options": {
            "displayLabels": [
              "percent"
            ],
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "values": [
                "value",
                "percent"
              ]
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "sort": "desc",
            "tooltip": {
              "mode": "single",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (prompt_type) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{prompt_type}}"
            }
          ],
          "transformations": [
            {
              "id": "rowsToFields",
              "options": {
                "mappings": [
                  {"fieldName": "prompt_type", "handlerKey": "field.name"},
                  {"fieldName": "Value #A", "handlerKey": "field.value"}
                ]
              }
            }
          ]
        },
        {
          "id": 7,
          "title": "Prompts By User",
          "description": "Current-schema admitted prompts grouped by canonical user. Linked accounts share a user ID. Gateway counts are zero-filled only for users with recorded prompts; an entirely empty result does not invent users. Counts exclude commands.",
          "type": "table",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "noValue": "Unknown",
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "User"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "string"
                  }
                ]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Total"
              }
            ],
            "footer": {
              "show": false,
              "enablePagination": true
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (user_id) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" | gateway=\"discord\" [$__range])) or (0 * sum by (user_id) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" [$__range])))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "Discord"
            },
            {
              "refId": "B",
              "editorMode": "code",
              "expr": "sum by (user_id) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" | gateway=\"imessage\" [$__range])) or (0 * sum by (user_id) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" [$__range])))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "iMessage"
            },
            {
              "refId": "C",
              "editorMode": "code",
              "expr": "sum by (user_id) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" | gateway=\"homeassistant\" [$__range])) or (0 * sum by (user_id) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" [$__range])))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "Home Assistant"
            },
            {
              "refId": "D",
              "editorMode": "code",
              "expr": "sum by (user_id) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.received\" | request_kind=\"prompt\" | is_admitted=\"true\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "Total"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "mode": "outerTabular",
                "byField": "user_id"
              }
            },
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {"names": ["user_id", "Value #A", "Value #B", "Value #C", "Value #D"]}
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "user_id": 0,
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4
                },
                "renameByName": {
                  "user_id": "User",
                  "Value #A": "Discord",
                  "Value #B": "iMessage",
                  "Value #C": "Home Assistant",
                  "Value #D": "Total"
                }
              }
            }
          ]
        },
        {
          "id": 3,
          "title": "End-to-End Prompt Latency",
          "description": "Fifteen-minute rolling latency in seconds from gateway receipt through runtime completion, including queueing and delivery. Includes failed and canceled admitted prompts. Gaps mean no requests in the window, not zero latency. P95 measures tail latency.",
          "type": "timeseries",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1,
              "unit": "s",
              "noValue": "No requests",
              "min": 0,
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 5,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 4,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "scaleDistribution": {
                  "type": "linear"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "avg_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.complete\" | request_kind=\"prompt\" | is_admitted=\"true\" | unwrap duration_ms | __error__=\"\" [15m]) by (gateway) / 1000",
              "queryType": "range",
              "legendFormat": "{{gateway}} average"
            },
            {
              "refId": "B",
              "editorMode": "code",
              "expr": "quantile_over_time(0.95, {namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"gateway.request.complete\" | request_kind=\"prompt\" | is_admitted=\"true\" | unwrap duration_ms | __error__=\"\" [15m]) by (gateway) / 1000",
              "queryType": "range",
              "legendFormat": "{{gateway}} p95"
            }
          ]
        },
        {
          "id": 9,
          "title": "Observed Chat Tokens",
          "description": "Current-schema provider-reported chat totals by model and workload. Legacy records without workload attribution are excluded. Reported usage from failed or canceled calls is included, but missing totals are never inferred as zero. Do not add these to gateway or broker aggregates.",
          "type": "table",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 9,
            "w": 16,
            "x": 0,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "noValue": "Unknown",
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              }
            },
            "overrides": []
          },
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Observed Tokens"
              }
            ],
            "footer": {
              "show": false,
              "enablePagination": true
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (model, workload) (sum_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"provider.gateway.chat.complete\" | is_usage_reported=\"true\" | total_tokens!=\"\" | unwrap total_tokens | __error__=\"\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "Observed Tokens"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "model": 0,
                  "workload": 1,
                  "Value #A": 2
                },
                "renameByName": {
                  "model": "Model",
                  "workload": "Workload",
                  "Value #A": "Observed Tokens"
                }
              }
            }
          ]
        },
        {
          "id": 10,
          "title": "Chat Usage Reporting",
          "description": "Usage completeness for submitted chat calls during the selected range. Incomplete includes missing, partial, invalid, and unsuccessful-call usage. Complete reporting is not proof of complete billing or lossless log ingestion.",
          "type": "piechart",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 16,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "true"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Complete"
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "green",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "false"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Incomplete / Unknown"
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "orange",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "displayLabels": [
              "percent"
            ],
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "values": [
                "value",
                "percent"
              ]
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "sort": "desc",
            "tooltip": {
              "mode": "single",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "sum by (is_usage_complete) (count_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"provider.gateway.chat.complete\" | is_submitted=\"true\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{is_usage_complete}}"
            }
          ],
          "transformations": [
            {
              "id": "rowsToFields",
              "options": {
                "mappings": [
                  {"fieldName": "is_usage_complete", "handlerKey": "field.name"},
                  {"fieldName": "Value #A", "handlerKey": "field.value"}
                ]
              }
            }
          ]
        },
        {
          "id": 11,
          "title": "Broker Queue and Active Work",
          "description": "Latest broker snapshots within a five-minute lookback, separated by process instance. Snapshots normally occur every 30 seconds. Values can remain stale until the lookback expires; absence is not zero. Outstanding includes active and queued work.",
          "type": "timeseries",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 29
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short",
              "min": 0,
              "noValue": "Telemetry unavailable",
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 5,
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "pointSize": 4,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "scaleDistribution": {
                  "type": "linear"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "last_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"broker.health\" | unwrap queued_count | __error__=\"\" [5m]) by (instance_id)",
              "queryType": "range",
              "legendFormat": "Queued"
            },
            {
              "refId": "B",
              "editorMode": "code",
              "expr": "last_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"broker.health\" | unwrap active_count | __error__=\"\" [5m]) by (instance_id)",
              "queryType": "range",
              "legendFormat": "Active"
            },
            {
              "refId": "C",
              "editorMode": "code",
              "expr": "last_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"broker.health\" | unwrap outstanding_count | __error__=\"\" [5m]) by (instance_id)",
              "queryType": "range",
              "legendFormat": "Outstanding"
            },
            {
              "refId": "D",
              "editorMode": "code",
              "expr": "last_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"broker.health\" | unwrap capacity | __error__=\"\" [5m]) by (instance_id)",
              "queryType": "range",
              "legendFormat": "Capacity"
            }
          ]
        },
        {
          "id": 12,
          "title": "Background Job Health",
          "description": "Latest database-wide job gauges within a five-minute lookback. Do not sum these across instances sharing one database. Active includes running jobs with expired leases; expired leases are a subset, not additional jobs. Snapshot reads can be delayed or fail, so missing data is not zero.",
          "type": "timeseries",
          "pluginVersion": "13.0.1",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 29
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "unit": "short",
              "min": 0,
              "noValue": "Telemetry unavailable",
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "pointSize": 4,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "scaleDistribution": {
                  "type": "linear"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
