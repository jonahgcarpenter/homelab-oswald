              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "editorMode": "code",
              "expr": "last_over_time({namespace=\"oswald-ai\",service_name=\"oswald-ai\"} | json | __error__=\"\" | log_schema_version=\"1\" | event=\"memory.jobs.health\" | unwrap queued_count | __error__=\"\" [5m]) by (job_kind, instance_id)",
              "queryType": "range",
              "legendFormat": "{{job_kind}} - Queued"
