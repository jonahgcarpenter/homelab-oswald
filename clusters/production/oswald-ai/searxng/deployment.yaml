apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:2026.5.2-aefc3c316
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BASE_URL
              value: "http://searxng:8080/"
            - name: SEARXNG_PORT
              value: "8080"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
      volumes:
        - name: config-volume
          configMap:
            name: searxng-config
